<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>势宝 E-Bot 实时语音聊天</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="home">
    <main class="app-shell">
      <header class="topbar" aria-label="站点导航">
        <a class="brand" href="/" aria-label="势宝 E-Bot 首页">
          <span class="brand-mark" aria-hidden="true">EB</span>
          <span>
            <strong>势宝 E-Bot</strong>
            <small>Embodied Energy</small>
          </span>
        </a>
        <div class="topbar-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connectionLabel">待连接</span>
        </div>
      </header>

      <section class="hero-grid" aria-label="势宝实时语音聊天">
        <section class="intro-panel">
          <p class="eyebrow">
            <span>E-Bot 专属部署</span>
            <i aria-hidden="true"></i>
          </p>
          <h1>
            <span>和势宝</span>
            <span>实时语音聊天</span>
          </h1>
          <p class="intro-copy">
            语音天然比文字更适合陪伴与协作。用户开口，势宝立即响应；访客接待、产品演示、具身智能科普和创意讨论都可以自然完成。
          </p>

          <div class="hero-actions">
            <a class="primary-action" id="startButton" href="/call.html">
              <span>开始语音通话</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 6 6 6-6 6" />
              </svg>
            </a>
            <button class="secondary-action" type="button" aria-label="观看演示">
              <span>观看演示</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7-11-7Z" />
              </svg>
            </button>
          </div>
        </section>

        <section class="visual-panel" aria-label="势宝语音通话邀请">
          <div class="call-device">
            <div class="incoming-card">
              <span class="mini-avatar" aria-hidden="true">EB</span>
              <div>
                <strong>势宝邀请你语音通话</strong>
                <span id="statusLabel">语音通话邀请</span>
              </div>
              <button class="mini-mic-button" id="muteButton" type="button" disabled aria-label="静音麦克风">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" />
                  <path d="M19 11a7 7 0 0 1-14 0" />
                  <path d="M12 18v3" />
                </svg>
              </button>
              <div class="audio-meter" id="localMeter" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>

            <div class="avatar-stage" id="avatarStage">
              <img class="mascot-image" src="/assets/ebot-mascot-transparent.png" alt="势宝 E-Bot 吉祥物" />
              <div class="call-orbs" aria-label="通话操作">
                <button class="call-orb reject" id="stopButton" type="button" aria-label="拒绝或结束通话">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.5 6.5 17.5 17.5" />
                    <path d="M17.5 6.5 6.5 17.5" />
                  </svg>
                  <span>拒绝</span>
                </button>
                <button class="call-orb answer" id="answerButton" type="button" aria-label="接听">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.6 10.7c2.1 4.1 5.6 6.3 7.7 6.7l2.1-2.1c.3-.3.7-.4 1.1-.3 1.1.4 2.2.6 3.4.6.6 0 1 .4 1 1v3.3c0 .6-.4 1-1 1C9.5 20.9 3.1 14.5 3.1 3.1c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.4.1.4 0 .8-.3 1.1l-2.1 2.1Z" />
                  </svg>
                  <span>接听</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <audio id="remoteAudio" autoplay playsinline></audio>
    <script type="module" src="/app.js?v=livekit-agent-20260603"></script>
  </body>
</html>
